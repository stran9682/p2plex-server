---
# ==============================================================================
# Playbook: Run Peer Scalability Benchmark
# ==============================================================================
# Executes the microbenchmark suite evaluating:
#   - Authorization decision latency vs. peer scale (N = 1..100)
#   - ACL mutation throughput (grant & revoke)
#   - Wire ALPN connection gate RTT
#   - Discovery catalog filtering latency
#   - Multi-threaded concurrent contention
#
# Usage:
#   ansible-playbook run_peer_benchmarks.yml [-e "quick=true"]
# ==============================================================================

- name: Run Peer Scalability Benchmarks
  hosts: mesh_servers
  become: false
  gather_facts: false

  vars:
    quick: false
    results_dir: "{{ playbook_dir }}/results"

  tasks:
    - name: Ensure local results directory exists on controller
      ansible.builtin.file:
        path: "{{ results_dir }}"
        state: directory
        mode: "0755"
      delegate_to: localhost
      run_once: true

    - name: Copy local video file to benchmark node (if local_video_file is specified)
      ansible.builtin.copy:
        src: "{{ local_video_file }}"
        dest: "/tmp/benchmark_video.mp4"
        mode: "0644"
      when: local_video_file is defined and local_video_file != ""

    - name: Determine video file path for benchmark
      ansible.builtin.set_fact:
        resolved_video_arg: >-
          {{
            '--video /tmp/benchmark_video.mp4' if (local_video_file is defined and local_video_file != "")
            else ('--video ' + video_file) if (video_file is defined and video_file != "")
            else ''
          }}

    - name: Run bench_access_control peers suite
      ansible.builtin.shell: |
        mkdir -p /tmp/bench_results
        {{ remote_project_dir }}/src-tauri/target/release/bench_access_control peers \
          {{ '--quick' if quick | bool else '' }} \
          {{ resolved_video_arg }} \
          --json --csv-dir /tmp/bench_results
      register: bench_output
      changed_when: false

    - name: Save benchmark JSON output on remote host
      ansible.builtin.copy:
        content: "{{ bench_output.stdout }}"
        dest: "/tmp/peer_bench_{{ inventory_hostname }}.json"
        mode: "0644"

    - name: Fetch benchmark JSON results to controller machine
      ansible.builtin.fetch:
        src: "/tmp/peer_bench_{{ inventory_hostname }}.json"
        dest: "{{ results_dir }}/peer_bench_{{ inventory_hostname }}.json"
        flat: true

    - name: Fetch summary CSV results to controller machine
      ansible.builtin.fetch:
        src: "/tmp/bench_results/peers_summary.csv"
        dest: "{{ results_dir }}/peer_bench_{{ inventory_hostname }}_summary.csv"
        flat: true

    - name: Fetch raw trial CSV samples to controller machine
      ansible.builtin.fetch:
        src: "/tmp/bench_results/peers_raw_samples.csv"
        dest: "{{ results_dir }}/peer_bench_{{ inventory_hostname }}_raw_samples.csv"
        flat: true

    - name: Display summary table for node
      ansible.builtin.debug:
        msg: "{{ bench_output.stdout_lines }}"
