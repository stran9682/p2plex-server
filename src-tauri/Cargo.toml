[package]
name = "video-server"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "video_server_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.104"
axum = "0.8.9"
bytes = "1.12.1"
dashmap = "6.2.1"
ed25519-dalek = "3.0.0"
ffmpeg-sidecar = { version = "2.5.2", features = ["download_ffmpeg"] }
hex = "0.4.3"
iroh = "1.1.0"
iroh-blobs = "0.103.0"
iroh-docs = "0.101.0"
iroh-gossip = "0.101.0"
mime_guess = "2.0.5"
rs_merkle = "1.5.0"
sha256 = "1.6.0"
sea-orm = { version = "2.0.0", features = [ "sqlx-sqlite", "runtime-tokio", "macros", "schema-sync", "entity-registry" ] }
tempfile = "3.27.0"
tokio = {version = "1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-util = "0.7.19"
thiserror = "2.0.20"
tauri-plugin-dialog = "2"
tower-http = {version = "0.7.1", features = [ "cors" ] }
uhlc = "0.9.0"
rand = "0.10.3"
p2panda-auth = { version = "0.7.1", features = ["serde", "test_utils"] }
p2panda-core = "0.7.1"
postcard = { version = "1.1.3", features = ["use-std"] }



# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
